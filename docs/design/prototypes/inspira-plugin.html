<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440" />
    <title>Inspira — 浏览器插件</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f7f6f2;
        color: #20201e;
        min-height: 100vh;
        padding: 40px;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== page ===== */
      .page-title {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .page-subtitle {
        font-size: 14px;
        color: #777570;
        margin-bottom: 34px;
      }
      .section-title {
        font-size: 12.5px;
        font-weight: 600;
        color: #a09b94;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 0 0 12px;
      }
      .stage {
        margin-bottom: 44px;
      }
      .stage-caption {
        margin-top: 12px;
        font-size: 12.5px;
        color: #a09b94;
      }

      /* ===== browser frame (position context) ===== */
      .browser {
        position: relative;
        width: 960px;
        height: 470px;
        background: #fff;
        border: 1px solid #e9e7e2;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 26px rgba(28, 24, 60, 0.06);
      }
      .browser-bar {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        background: #f2f1ed;
        border-bottom: 1px solid #e9e7e2;
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #dcdad4;
      }
      .address {
        flex: 1;
        height: 28px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #e9e7e2;
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 12.5px;
        color: #a09b94;
      }
      .tool-icons {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tool-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a09b94;
      }
      .tool-icon.is-active {
        background: #f0effe;
      }
      .tool-icon svg {
        width: 18px;
        height: 18px;
      }

      .browser-body {
        padding: 34px 44px;
      }
      .web-lines {
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .web-line {
        height: 11px;
        border-radius: 4px;
        background: #f0efeb;
      }

      /* ===== the popup ===== */
      .popup {
        width: 384px;
        background: #fff;
        border-radius: 14px;
        border: 1px solid #edece8;
        box-shadow: 0 12px 34px rgba(28, 24, 60, 0.14);
        overflow: hidden;
      }
      .popup-floating {
        position: absolute;
        top: 56px;
        right: 14px;
        z-index: 2;
      }
      .pane {
        padding: 19px 22px 20px;
        display: flex;
        flex-direction: column;
      }
      .pane-center {
        align-items: flex-start;
        justify-content: center;
        height: 100%;
      }
      .popup-compact {
        height: 160px;
      }
      .popup-compact.is-short {
        height: 118px;
      }

      /* ===== state head ===== */
      .head {
        display: flex;
        align-items: center;
        gap: 11px;
        padding-bottom: 15px;
      }
      .mark {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
      }
      .title {
        font-size: 16.5px;
        font-weight: 600;
        letter-spacing: -0.2px;
        color: #20201e;
      }

      .divider {
        height: 1px;
        background: #edece8;
        margin: 0 -22px;
      }

      /* ===== minimal fields (shared by every content type) ===== */
      .field {
        padding: 13px 0;
      }
      .input {
        display: block;
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-family: inherit;
        font-size: 14.5px;
        color: #20201e;
      }
      .input::placeholder {
        color: #a09b94;
      }
      .textarea {
        resize: none;
        min-height: 62px;
        line-height: 1.65;
      }
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-height: 22px;
      }
      .tag-row .input {
        flex: 1;
        min-width: 96px;
        width: auto;
      }
      .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 6px;
        background: #f4f3f0;
        color: #737169;
        font-size: 12.5px;
        font-weight: 500;
      }
      .tag-chip .x {
        font-size: 13px;
        line-height: 1;
        opacity: 0.5;
      }

      .foot {
        margin-top: 6px;
        font-size: 12.5px;
        color: #a09b94;
        text-decoration: none;
        align-self: flex-start;
      }
      .foot:hover {
        color: #6c63ff;
      }

      /* ===== saving ===== */
      .saving {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .spinner {
        width: 19px;
        height: 19px;
        border-radius: 50%;
        border: 1.8px solid rgba(108, 99, 255, 0.18);
        border-top-color: #6c63ff;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .saving-text {
        font-size: 15.5px;
        font-weight: 500;
        color: #777570;
      }

      /* ===== shared message ui (sign-in / cannot save) ===== */
      .msg {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .msg-body {
        padding-top: 1px;
      }
      .msg-title {
        font-size: 15.5px;
        font-weight: 600;
        letter-spacing: -0.2px;
        color: #20201e;
        margin-bottom: 5px;
      }
      .msg-desc {
        font-size: 13.5px;
        line-height: 1.65;
        color: #777570;
      }
      .link {
        color: #6c63ff;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .msg-action {
        margin-top: 13px;
      }

      .btn {
        border: none;
        border-radius: 9px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 500;
        padding: 9px 18px;
        cursor: pointer;
        background: #6c63ff;
        color: #fff;
        transition: background 0.15s;
      }
      .btn:hover {
        background: #5b52e8;
      }

      /* ===== boards ===== */
      .boards {
        display: flex;
        flex-wrap: wrap;
        gap: 30px 26px;
      }
      .board-label {
        font-size: 12.5px;
        font-weight: 600;
        color: #a09b94;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient
          id="inspiraGrad"
          x1="6"
          y1="4"
          x2="28"
          y2="30"
          gradientUnits="userSpaceOnUse">
          <stop stop-color="#8b7ef7" />
          <stop offset="1" stop-color="#6c63ff" />
        </linearGradient>
      </defs>
    </svg>

    <div class="page-title">Inspira 浏览器插件</div>
    <div class="page-subtitle">
      宽扁弹窗 · 所有类型保存后共用同一补充框 · 标签同行输入 · 统一消息 UI
    </div>

    <!-- ============ POSITION CONTEXT ============ -->
    <div class="stage">
      <div class="section-title">弹出位置</div>
      <div class="browser">
        <div class="browser-bar">
          <div class="dots"><i></i><i></i><i></i></div>
          <div class="address">refactoringui.com</div>
          <div class="tool-icons">
            <span class="tool-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path
                  d="M20.5 3.5h-6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2Z" />
                <path
                  d="M10.5 8.5h-6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2Z" />
              </svg>
            </span>
            <span class="tool-icon is-active">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect
                  x="7.5"
                  y="7.5"
                  width="17"
                  height="17"
                  rx="5"
                  transform="rotate(45 16 16)"
                  fill="url(#inspiraGrad)" />
              </svg>
            </span>
          </div>
        </div>

        <div class="browser-body">
          <div class="web-lines">
            <div class="web-line" style="width: 46%"></div>
            <div class="web-line" style="width: 82%"></div>
            <div class="web-line" style="width: 74%"></div>
            <div class="web-line" style="width: 88%"></div>
            <div class="web-line" style="width: 63%"></div>
            <div class="web-line" style="width: 79%"></div>
          </div>
        </div>

        <!-- SAVED, anchored to the top-right -->
        <div class="popup popup-floating">
          <div class="pane">
            <div class="head">
              <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect
                  x="7.5"
                  y="7.5"
                  width="17"
                  height="17"
                  rx="5"
                  transform="rotate(45 16 16)"
                  fill="url(#inspiraGrad)" />
              </svg>
              <span class="title">已保存到 Inspira</span>
            </div>

            <div class="divider"></div>

            <div class="field">
              <div class="tag-row">
                <input class="input" type="text" placeholder="添加标签…" />
              </div>
            </div>

            <div class="divider"></div>

            <div class="field">
              <textarea
                class="textarea input"
                placeholder="写点备注…"></textarea>
            </div>

            <a href="#" class="foot">在 Inspira 中查看</a>
          </div>
        </div>
      </div>
      <div class="stage-caption">
        弹窗宽度 384px（≈ 1920 宽屏的 1/5），锚定工具栏图标下方、屏幕右上角
      </div>
    </div>

    <!-- ============ STATES ============ -->
    <div class="section-title">状态</div>
    <div class="boards">
      <!-- SAVING -->
      <div>
        <div class="board-label">保存中</div>
        <div class="popup popup-compact is-short">
          <div class="pane pane-center">
            <div class="saving">
              <div class="spinner"></div>
              <span class="saving-text">正在保存…</span>
            </div>
          </div>
        </div>
      </div>

      <!-- SAVED (filled) -->
      <div>
        <div class="board-label">保存成功 · 已填写</div>
        <div class="popup">
          <div class="pane">
            <div class="head">
              <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect
                  x="7.5"
                  y="7.5"
                  width="17"
                  height="17"
                  rx="5"
                  transform="rotate(45 16 16)"
                  fill="url(#inspiraGrad)" />
              </svg>
              <span class="title">已保存到 Inspira</span>
            </div>

            <div class="divider"></div>

            <div class="field">
              <div class="tag-row">
                <span class="tag-chip">front<i class="x">×</i></span>
                <span class="tag-chip">设计<i class="x">×</i></span>
                <input class="input" type="text" placeholder="添加标签…" />
              </div>
            </div>

            <div class="divider"></div>

            <div class="field">
              <textarea class="textarea input">先存下来，回头再整理。</textarea>
            </div>

            <a href="#" class="foot">在 Inspira 中查看</a>
          </div>
        </div>
      </div>

      <!-- NOT SIGNED IN -->
      <div>
        <div class="board-label">未登录</div>
        <div class="popup popup-compact">
          <div class="pane pane-center">
            <div class="msg">
              <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect
                  x="7.5"
                  y="7.5"
                  width="17"
                  height="17"
                  rx="5"
                  transform="rotate(45 16 16)"
                  fill="none"
                  stroke="#6c63ff"
                  stroke-opacity="0.45"
                  stroke-width="1.8" />
                <circle cx="16" cy="16" r="2.4" fill="#6c63ff" fill-opacity="0.55" />
              </svg>
              <div class="msg-body">
                <div class="msg-title">无法保存到 Inspira</div>
                <div class="msg-desc">
                  请先 <a class="link" href="inspira-landing.html">登录</a>，再重新保存这一条。
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- CANNOT SAVE -->
      <div>
        <div class="board-label">无法保存</div>
        <div class="popup popup-compact">
          <div class="pane pane-center">
            <div class="msg">
              <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect
                  x="7.5"
                  y="7.5"
                  width="17"
                  height="17"
                  rx="5"
                  transform="rotate(45 16 16)"
                  fill="none"
                  stroke="#6c63ff"
                  stroke-opacity="0.45"
                  stroke-width="1.8" />
                <path
                  d="M12.5 12.5l7 7M19.5 12.5l-7 7"
                  stroke="#6c63ff"
                  stroke-opacity="0.5"
                  stroke-width="1.8"
                  stroke-linecap="round" />
              </svg>
              <div class="msg-body">
                <div class="msg-title">无法保存到 Inspira</div>
                <div class="msg-desc">
                  这个页面不支持读取内容，或网络暂时不可用。
                </div>
                <div class="msg-action">
                  <button class="btn">重试</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
