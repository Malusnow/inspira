<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inspira — Explore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet" />
    <script
      async
      onload="window.lucide?.createIcons()"
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #0e0e0e;
        color: #e5e4e0;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        overflow: hidden;
      }

      /* ============================================
     BACK BUTTON
     ============================================ */
      .back-btn {
        position: fixed;
        top: 24px;
        left: 32px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 10px;
        border: none;
        background: transparent;
        font-size: 14px;
        font-family: inherit;
        color: #777570;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
      }
      .back-btn:hover {
        color: #e5e4e0;
        background: rgba(255, 255, 255, 0.04);
      }
      .back-btn svg {
        width: 16px;
        height: 16px;
      }

      .page-name {
        position: fixed;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        font-size: 13px;
        font-weight: 500;
        color: #55524e;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* ============================================
     PHASE 1: TAG CONSTELLATION
     ============================================ */
      .tag-constellation {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      .tag-constellation.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .tag-node {
        position: absolute;
        font-size: 15px;
        font-weight: 500;
        color: rgba(229, 228, 224, 0.35);
        cursor: pointer;
        user-select: none;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 8px 16px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .tag-node:hover {
        color: rgba(229, 228, 224, 0.9);
        transform: scale(1.15) translateY(-2px);
        text-shadow: 0 0 30px rgba(108, 99, 255, 0.3);
      }
      .tag-node.active {
        color: #fff;
        transform: scale(1.3);
        text-shadow: 0 0 40px rgba(108, 99, 255, 0.5);
      }

      /* Size variations based on content volume */
      .tag-node.size-l {
        font-size: 22px;
        font-weight: 600;
        color: rgba(229, 228, 224, 0.5);
      }
      .tag-node.size-l:hover {
        color: rgba(229, 228, 224, 0.95);
      }
      .tag-node.size-m {
        font-size: 16px;
        font-weight: 500;
        color: rgba(229, 228, 224, 0.4);
      }
      .tag-node.size-s {
        font-size: 13px;
        font-weight: 400;
        color: rgba(229, 228, 224, 0.25);
      }
      .tag-node.size-s:hover {
        color: rgba(229, 228, 224, 0.7);
      }

      /* Floating animation */
      @keyframes float1 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(8px, -12px);
        }
      }
      @keyframes float2 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-10px, 8px);
        }
      }
      @keyframes float3 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(6px, 10px);
        }
      }
      @keyframes float4 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-8px, -6px);
        }
      }

      .tag-node:nth-child(1) {
        animation: float1 8s ease-in-out infinite;
      }
      .tag-node:nth-child(2) {
        animation: float2 10s ease-in-out infinite 1s;
      }
      .tag-node:nth-child(3) {
        animation: float3 9s ease-in-out infinite 0.5s;
      }
      .tag-node:nth-child(4) {
        animation: float4 11s ease-in-out infinite 2s;
      }
      .tag-node:nth-child(5) {
        animation: float1 7s ease-in-out infinite 1.5s;
      }
      .tag-node:nth-child(6) {
        animation: float2 12s ease-in-out infinite 0.3s;
      }
      .tag-node:nth-child(7) {
        animation: float3 8.5s ease-in-out infinite 2.5s;
      }
      .tag-node:nth-child(8) {
        animation: float4 9.5s ease-in-out infinite 1.2s;
      }
      .tag-node:nth-child(9) {
        animation: float1 10.5s ease-in-out infinite 0.8s;
      }
      .tag-node:nth-child(10) {
        animation: float2 7.5s ease-in-out infinite 3s;
      }

      .tag-constellation-hint {
        position: fixed;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        color: rgba(229, 228, 224, 0.2);
        text-align: center;
        pointer-events: none;
        transition: opacity 0.4s;
      }

      /* ============================================
     PHASE 2: CARD CONSTELLATION
     ============================================ */
      .card-constellation {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      .card-constellation.active {
        display: flex;
        opacity: 1;
      }

      .constellation-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(108, 99, 255, 0.04) 0%,
          transparent 70%
        );
      }

      /* Background cards */
      .bg-card {
        position: absolute;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        background: #1a1a1a;
      }
      .bg-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.4;
        transition: opacity 0.4s;
      }
      .bg-card:hover img {
        opacity: 0.7;
      }
      .bg-card:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      /* Specific bg card positions */
      .bg-card.pos-1 {
        width: 140px;
        height: 100px;
        top: 12%;
        left: 8%;
        transform: rotate(-6deg);
      }
      .bg-card.pos-2 {
        width: 120px;
        height: 160px;
        top: 8%;
        right: 12%;
        transform: rotate(4deg);
      }
      .bg-card.pos-3 {
        width: 100px;
        height: 75px;
        bottom: 18%;
        left: 15%;
        transform: rotate(3deg);
      }
      .bg-card.pos-4 {
        width: 130px;
        height: 90px;
        bottom: 12%;
        right: 10%;
        transform: rotate(-4deg);
      }
      .bg-card.pos-5 {
        width: 90px;
        height: 120px;
        top: 35%;
        left: 5%;
        transform: rotate(5deg);
      }
      .bg-card.pos-6 {
        width: 110px;
        height: 80px;
        top: 20%;
        right: 6%;
        transform: rotate(-3deg);
      }
      .bg-card.pos-7 {
        width: 80px;
        height: 110px;
        bottom: 30%;
        right: 18%;
        transform: rotate(6deg);
      }
      .bg-card.pos-8 {
        width: 100px;
        height: 70px;
        top: 55%;
        left: 10%;
        transform: rotate(-5deg);
      }

      /* Central card */
      .center-card-wrap {
        position: relative;
        z-index: 10;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .center-card {
        width: 420px;
        border-radius: 14px;
        overflow: hidden;
        background: #1a1a1a;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 80px rgba(108, 99, 255, 0.08);
        cursor: pointer;
        transition: transform 0.3s;
      }
      .center-card:hover {
        transform: scale(1.02);
      }
      .center-card img {
        width: 100%;
        display: block;
      }

      .center-card-web {
        background: #1a1a1a;
      }
      .center-card-web-thumb {
        width: 100%;
        aspect-ratio: 16/10;
        overflow: hidden;
      }
      .center-card-web-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .center-card-web-body {
        padding: 18px 20px 20px;
      }
      .center-card-web-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #e5e4e0;
      }
      .center-card-web-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: #777570;
        font-size: 13px;
      }
      .center-card-web-fav {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        background: #333;
      }
      .center-card-web-excerpt {
        font-size: 14px;
        color: #777570;
        line-height: 1.6;
      }

      .center-card-note {
        padding: 24px 22px;
        font-size: 15px;
        line-height: 1.7;
        color: #e5e4e0;
        background: #1a1a1a;
      }
      .center-card-note time {
        display: block;
        margin-top: 14px;
        font-size: 12px;
        color: #55524e;
      }

      .center-card-quote {
        padding: 28px 24px;
        background: #1a1a1a;
      }
      .center-card-quote-text {
        font-size: 18px;
        line-height: 1.6;
        font-weight: 500;
        color: #e5e4e0;
        margin-bottom: 16px;
      }
      .center-card-quote-source {
        font-size: 14px;
        color: #55524e;
      }

      .center-card-video {
        position: relative;
      }
      .center-card-video img {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        display: block;
      }
      .center-card-video-play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .center-card-video-play-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .center-card-video-play-btn svg {
        width: 20px;
        height: 20px;
        color: #20201e;
        margin-left: 2px;
      }
      .center-card-video-body {
        padding: 16px 20px;
        background: #1a1a1a;
      }
      .center-card-video-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #e5e4e0;
      }
      .center-card-video-source {
        font-size: 13px;
        color: #55524e;
      }

      /* Navigation arrows */
      .nav-arrow {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        color: rgba(229, 228, 224, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 20;
        transition: all 0.2s;
      }
      .nav-arrow:hover {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(229, 228, 224, 0.8);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .nav-arrow svg {
        width: 18px;
        height: 18px;
      }
      .nav-arrow.prev {
        left: 32px;
      }
      .nav-arrow.next {
        right: 32px;
      }

      /* Tag label at top */
      .current-tag {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .current-tag-label {
        font-size: 14px;
        font-weight: 500;
        color: rgba(229, 228, 224, 0.5);
        padding: 6px 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .current-tag-reset {
        font-size: 12px;
        color: #777570;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: all 0.15s;
        border: none;
        background: transparent;
        font-family: inherit;
      }
      .current-tag-reset:hover {
        color: #e5e4e0;
        background: rgba(255, 255, 255, 0.04);
      }

      /* Shuffle button */
      .shuffle-btn {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        color: #777570;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
      }
      .shuffle-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #e5e4e0;
      }
      .shuffle-btn svg {
        width: 14px;
        height: 14px;
      }

      /* ============================================
     DETAIL OVERLAY
     ============================================ */
      .detail-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .detail-overlay.active {
        display: flex;
        opacity: 1;
      }

      .detail-card-large {
        width: 520px;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 16px;
        background: #1a1a1a;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        animation: detailIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes detailIn {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .detail-card-large img {
        width: 100%;
        display: block;
      }
      .detail-body {
        padding: 24px;
      }
      .detail-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #e5e4e0;
      }
      .detail-meta {
        font-size: 13px;
        color: #55524e;
        margin-bottom: 16px;
      }
      .detail-tags {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .detail-tag {
        padding: 5px 12px;
        border-radius: 8px;
        background: rgba(108, 99, 255, 0.1);
        color: #8b7ef7;
        font-size: 12.5px;
      }
      .detail-desc {
        font-size: 14px;
        line-height: 1.7;
        color: #777570;
      }
      .detail-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: none;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        transition: background 0.15s;
      }
      .detail-close:hover {
        background: rgba(0, 0, 0, 0.6);
      }
      .detail-close svg {
        width: 18px;
        height: 18px;
      }

      /* ============================================
     DEMO CONTROLS
     ============================================ */
      .demo-controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 500;
      }
      .demo-btn {
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: transparent;
        font-size: 12px;
        font-weight: 500;
        color: #777570;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }
      .demo-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #e5e4e0;
      }
      .demo-btn.active {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.15);
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .tag-node {
          animation: none !important;
        }
        .tag-constellation,
        .card-constellation,
        .bg-card,
        .center-card-wrap {
          transition: opacity 0.2s ease !important;
        }
      }
    </style>
    <link rel="stylesheet" href="prototype-shell.css" />
    <script defer src="prototype-shell.js"></script>
  </head>
  <body data-page="explore">
    <div id="prototypeShell"></div>
    <h1 class="explore-title">Explore</h1>
    <!-- ===================== PHASE 1: TAG CONSTELLATION ===================== -->
    <div class="tag-constellation" id="tagConstellation">
      <div
        class="tag-node size-l"
        style="top: 22%; left: 18%"
        onclick="selectTag(this,'建筑')">
        建筑
      </div>
      <div
        class="tag-node size-m"
        style="top: 15%; left: 45%"
        onclick="selectTag(this,'UI 设计')">
        UI 设计
      </div>
      <div
        class="tag-node size-l"
        style="top: 28%; right: 20%"
        onclick="selectTag(this,'摄影')">
        摄影
      </div>
      <div
        class="tag-node size-s"
        style="top: 38%; left: 12%"
        onclick="selectTag(this,'配色')">
        配色
      </div>
      <div
        class="tag-node size-m"
        style="top: 45%; right: 15%"
        onclick="selectTag(this,'React')">
        React
      </div>
      <div
        class="tag-node size-l"
        style="top: 55%; left: 25%"
        onclick="selectTag(this,'产品灵感')">
        产品灵感
      </div>
      <div
        class="tag-node size-s"
        style="top: 48%; left: 55%"
        onclick="selectTag(this,'稍后阅读')">
        稍后阅读
      </div>
      <div
        class="tag-node size-m"
        style="top: 65%; right: 28%"
        onclick="selectTag(this,'排版')">
        排版
      </div>
      <div
        class="tag-node size-s"
        style="top: 72%; left: 40%"
        onclick="selectTag(this,'侘寂')">
        侘寂
      </div>
      <div
        class="tag-node size-m"
        style="top: 60%; left: 8%"
        onclick="selectTag(this,'动效')">
        动效
      </div>

      <div class="tag-constellation-hint">
        选择一个念头，看看它会带你去哪里。
      </div>
    </div>

    <!-- ===================== PHASE 2: CARD CONSTELLATION ===================== -->
    <div class="card-constellation" id="cardConstellation">
      <div class="constellation-bg"></div>

      <!-- Background cards -->
      <div class="bg-card pos-1" onclick="swapCard(0)">
        <img
          src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=300&q=80"
          alt="" />
      </div>
      <div class="bg-card pos-2" onclick="swapCard(1)">
        <img
          src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=300&q=80"
          alt="" />
      </div>
      <div class="bg-card pos-3" onclick="swapCard(2)">
        <img
          src="https://images.unsplash.com/photo-1580192985016-821f5f9571d3?w=300&q=80"
          alt="" />
      </div>
      <div class="bg-card pos-4" onclick="swapCard(3)">
        <img
          src="https://images.unsplash.com/photo-1504893524553-b855bce32c67?w=300&q=80"
          alt="" />
      </div>
      <div class="bg-card pos-5" onclick="swapCard(4)">
        <img
          src="https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=300&q=80"
          alt="" />
      </div>
      <div class="bg-card pos-6" onclick="swapCard(5)">
        <img
          src="https://images.unsplash.com/photo-1615529182904-14819c35db37?w=300&q=80"
          alt="" />
      </div>
      <div class="bg-card pos-7" onclick="swapCard(6)">
        <img
          src="https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=300&q=80"
          alt="" />
      </div>
      <div class="bg-card pos-8" onclick="swapCard(7)">
        <img
          src="https://images.unsplash.com/photo-1528164344705-47542687000d?w=300&q=80"
          alt="" />
      </div>

      <!-- Center card -->
      <div class="center-card-wrap" id="centerCardWrap">
        <div class="center-card" id="centerCard" onclick="openDetail()">
          <img
            src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&q=80"
            alt="光之教堂"
            id="centerImg" />
        </div>
      </div>

      <!-- Nav arrows -->
      <button class="nav-arrow prev" onclick="prevCard()">
        <i data-lucide="chevron-left"></i>
      </button>
      <button class="nav-arrow next" onclick="nextCard()">
        <i data-lucide="chevron-right"></i>
      </button>

      <!-- Current tag label -->
      <div class="current-tag">
        <span class="current-tag-label" id="currentTagLabel">建筑</span>
        <button class="current-tag-reset" onclick="backToTags()">
          返回标签
        </button>
      </div>

      <!-- Shuffle -->
      <button class="shuffle-btn" onclick="shuffleCards()">
        <i data-lucide="shuffle"></i>
        换一组
      </button>
    </div>

    <script>
      window.lucide?.createIcons()

      const cards = [
        {
          type: "image",
          img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&q=80",
          title: "安藤忠雄的光之教堂",
          meta: "摄影 · 2024年3月"
        },
        {
          type: "web",
          img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80",
          title: "建筑中的光线设计",
          source: "archdaily.com",
          excerpt:
            "探讨如何通过建筑开口控制自然光，创造不同的空间氛围和情感体验。"
        },
        {
          type: "note",
          text: "混凝土、光线和沉默。\n\n安藤忠雄的设计哲学：用最简单的材料创造最丰富的空间体验。",
          time: "昨天"
        },
        { type: "quote", text: "建筑是光的容器。", source: "— Louis Kahn" },
        {
          type: "image",
          img: "https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=800&q=80",
          title: "低饱和建筑摄影",
          meta: "摄影 · 2024年1月"
        },
        {
          type: "web",
          img: "https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=800&q=80",
          title: "日本现代建筑巡礼",
          source: "dezeen.com",
          excerpt: "从安藤忠雄到隈研吾，探索日本当代建筑师的独特设计语言。"
        }
      ]
      let currentIndex = 0

      function selectTag(el, tagName) {
        document
          .querySelectorAll(".tag-node")
          .forEach((n) => n.classList.remove("active"))
        el.classList.add("active")
        setTimeout(() => {
          document.getElementById("tagConstellation").classList.add("hidden")
          document.getElementById("cardConstellation").classList.add("active")
          document.getElementById("currentTagLabel").textContent = tagName
          loadCard(0)
        }, 400)
      }

      function backToTags() {
        document.getElementById("cardConstellation").classList.remove("active")
        document.getElementById("tagConstellation").classList.remove("hidden")
        document
          .querySelectorAll(".tag-node")
          .forEach((n) => n.classList.remove("active"))
      }

      function loadCard(index) {
        currentIndex = index
        const card = cards[index]
        const wrap = document.getElementById("centerCardWrap")
        wrap.style.opacity = "0"
        wrap.style.transform = "scale(.92)"
        setTimeout(() => {
          const el = document.getElementById("centerCard")
          if (card.type === "image") {
            el.className = "center-card"
            el.innerHTML = '<img src="' + card.img + '" alt="" id="centerImg">'
          } else if (card.type === "web") {
            el.className = "center-card center-card-web"
            el.innerHTML =
              '<div class="center-card-web-thumb"><img src="' +
              card.img +
              '" alt=""></div><div class="center-card-web-body"><div class="center-card-web-title">' +
              card.title +
              '</div><div class="center-card-web-meta"><div class="center-card-web-fav"></div>' +
              card.source +
              '</div><div class="center-card-web-excerpt">' +
              card.excerpt +
              "</div></div>"
          } else if (card.type === "note") {
            el.className = "center-card center-card-note"
            el.innerHTML =
              card.text.replace(/\n/g, "<br>") +
              "<time>" +
              card.time +
              "</time>"
          } else if (card.type === "quote") {
            el.className = "center-card center-card-quote"
            el.innerHTML =
              '<div class="center-card-quote-text">' +
              card.text +
              '</div><div class="center-card-quote-source">' +
              card.source +
              "</div>"
          }
          wrap.style.opacity = "1"
          wrap.style.transform = "scale(1)"
          window.lucide?.createIcons()
        }, 250)
      }

      function swapCard(index) {
        loadCard(index % cards.length)
      }

      function prevCard() {
        currentIndex = (currentIndex - 1 + cards.length) % cards.length
        loadCard(currentIndex)
      }

      function nextCard() {
        currentIndex = (currentIndex + 1) % cards.length
        loadCard(currentIndex)
      }

      function shuffleCards() {
        const indices = cards.map((_, i) => i).sort(() => Math.random() - 0.5)
        loadCard(indices[0])
      }

      function openDetail() {
        const card = cards[currentIndex]
        window.showPrototypeDetail({
          title: card.title || (card.type === "note" ? "笔记" : "摘录"),
          img: card.img,
          text: card.text,
          tags: [document.getElementById("currentTagLabel").textContent],
          notes: ""
        })
      }

      function closeDetail() {
        document.getElementById("prototypeDetail").close()
      }

      // Keyboard navigation
      document.addEventListener("keydown", function (e) {
        if (document.querySelector("dialog[open]")) return
        if (
          document
            .getElementById("cardConstellation")
            .classList.contains("active")
        ) {
          if (e.key === "ArrowLeft") prevCard()
          if (e.key === "ArrowRight") nextCard()
          if (e.key === "Escape") {
            if (document.getElementById("prototypeDetail")?.open) {
              closeDetail()
            } else {
              backToTags()
            }
          }
        }
      })
    </script>
  </body>
</html>
