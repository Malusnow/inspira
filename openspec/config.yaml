schema: spec-driven

context: |
  Inspira 使用 pnpm Monorepo，产品范围和实现顺序见 docs/PRODUCT.md。
  按当前任务读取根及目标目录 AGENTS.md、相关源码和文档。
  架构见 docs/ARCHITECTURE.md，契约见 docs/CONTRACTS.md，验证入口见 docs/DEVELOPMENT.md。
  说明正文用中文，保留 schema 要求的结构标记。
  需求确认与实现完成分别记录，不把文档或空配置视为运行证据。

rules:
  proposal:
    - 明确用户流程或工程能力、包含与不包含的范围及实际受影响文件。
    - 不把计划中的业务功能描述为已实现；关联已有决策 ID。
  specs:
    - 要求写为可验证行为，区分确认需求与未定问题。
    - 涉及私人数据时覆盖身份和所有权，涉及采集时区分新操作与重试。
  design:
    - 对照当前代码与文档，区分事实、建议、待决定和需要技术验证。
    - 标明决策依赖、官方资料来源和必要实验，避免复制公共协议定义。
  tasks:
    - 每项任务写明完成证据，使用真实存在或本任务将建立的验证入口。
    - 任务按依赖排序；未定行为逐项确认，不把等待回答当作已解决。

operations:
  apply:
    guidance:
      - 按当前用户授权范围推进，及时记录已完成任务与未验证项。
      - 未定产品问题逐项确认并同步台账，继续不依赖该问题的工作。
  archive:
    guidance:
      - 核对实际完成证据，只同步本变更交付的能力，不把规划当实现。
